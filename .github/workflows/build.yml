name: build

# Builds the WPF app (net8.0-windows), runs the xUnit tests and publishes
# a framework-dependent win-x64 artifact when a release tagged "v*"
# (e.g. v1.1.3) is published.
on:
  release:
    types: [published]
  # Manual run from the Actions tab (useful to validate the workflow
  # without cutting a release).
  workflow_dispatch:

jobs:
  build:
    # Extra guard: only run for tags like v1.1.3, ignore other releases.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LuaToolsGui.sln

      - name: Build
        run: dotnet build LuaToolsGui.sln -c Release --no-restore

      - name: Test
        run: dotnet test LuaToolsGui.sln -c Release --no-build

      - name: Publish
        # Framework-dependent keeps the artifact small (needs the .NET 8
        # desktop runtime on the machine). For a self-contained bundle add:
        # -r win-x64 --self-contained true
        run: dotnet publish src/LuaToolsGui/LuaToolsGui.csproj -c Release --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaTools-win-x64
          path: publish/
